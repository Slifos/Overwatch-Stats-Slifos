name: Sauvegarde des stats Overwatch

on:
  schedule:
    - cron: '0 */6 * * *' # toutes les 6 heures (heure UTC)
  workflow_dispatch: # permet aussi de la lancer à la main depuis l'onglet Actions

permissions:
  contents: write

jobs:
  sauvegarde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node sauvegarde.js

      - name: Enregistre les stats dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add saisons
          git diff --cached --quiet || git commit -m "Sauvegarde des stats du $(date -u +%Y-%m-%d)"
          git push
