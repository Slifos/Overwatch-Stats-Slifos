name: Sauvegarde des stats Overwatch

on:
  schedule:
    - cron: '0 */6 * * *' # toutes les 6 heures (heure UTC)
  workflow_dispatch: # permet aussi de la lancer à la main depuis l'onglet Actions

jobs:
  sauvegarde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: node sauvegarde.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
